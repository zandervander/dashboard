<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melonly Style Dashboard</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-5">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">🛡️ MelonlyPanel</h1>
            <nav class="mt-8 space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium">Overview</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200">Activity Logs</a>
            </nav>
        </div>
        
        <!-- Sidebar Profile Area -->
        <div id="sidebar-profile" class="p-4 border-t border-slate-800 flex items-center gap-3 bg-slate-950/40">
            <button onclick="loginWithDiscord()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded text-center transition-colors">
                Connect Discord
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between px-6">
            <h2 class="text-lg font-semibold">Dashboard Control</h2>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-950 text-green-400 border border-green-800">Online</span>
        </header>

        <div class="p-6 space-y-6">
            <!-- Action Card -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                <h3 class="text-md font-medium">Trigger Mod Action</h3>
                <p class="text-sm text-slate-400">All configurations run directly from this file. Submit to route data to BotGhost.</p>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Action Notes / Details</label>
                    <input type="text" id="webhook-msg" value="Staff activity update logged." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <button onclick="sendWebhook()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-medium rounded-lg transition-colors">
                    Send Authenticated Webhook
                </button>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURATION VARIABLES ====================
        const DISCORD_CLIENT_ID = 'YOUR_DISCORD_CLIENT_ID'; 
        const BOTGHOST_WEBHOOK_URL = 'YOUR_BOTGHOST_WEBHOOK_URL';
        
        // This must match exactly where your file is hosted (e.g., http://127.0.0)
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        // =================================================================

        let userData = null;

        // Redirects directly to Discord without revealing secrets
        function loginWithDiscord() {
            if (DISCORD_CLIENT_ID === 'YOUR_DISCORD_CLIENT_ID') {
                return alert('Please replace hardcoded variables in the script tag first!');
            }
            const scope = 'identify';
            const authUrl = `https://discord.com{DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scope}`;
            window.location.href = authUrl;
        }

        // Checks for the access token in the URL after Discord redirects back
        async function checkCallback() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                // Clear the token from the URL bar clean
                window.history.replaceState({}, document.title, window.location.pathname);
                
                try {
                    // Fetch user info using browser request
                    const response = await fetch('https://discord.com', {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    userData = await response.json();
                    updateProfileUI(userData);
                } catch (err) {
                    console.error('Failed to grab Discord user profile data', err);
                }
            }
        }

        function updateProfileUI(user) {
            const profileArea = document.getElementById('sidebar-profile');
            const avatarUrl = user.avatar ? `https://discordapp.com{user.id}/${user.avatar}.png` : 'https://discordapp.com';
            
            profileArea.innerHTML = `
                <img src="${avatarUrl}" class="w-8 h-8 rounded-full border border-slate-700" alt="Avatar">
                <div class="flex-1 overflow-hidden">
                    <p class="text-xs font-semibold truncate">${user.username}</p>
                    <p class="text-[10px] text-slate-500 truncate">ID: ${user.id}</p>
                </div>
                <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300">Exit</button>
            `;
        }

        function logout() {
            window.location.reload();
        }

        async function sendWebhook() {
            if (BOTGHOST_WEBHOOK_URL === 'YOUR_BOTGHOST_WEBHOOK_URL') {
                return alert('Please set your BotGhost Webhook URL variable!');
            }

            const message = document.getElementById('webhook-msg').value;
            
            const payload = {
                content: message,
                embeds: [{
                    title: "Dashboard Action Triggered",
                    color: 5793266, 
                    fields: [
                        { name: "Authorized User", value: userData ? `${userData.username} (<@${userData.id}>)` : "Anonymous", inline: true },
                        { name: "User ID", value: userData ? userData.id : "N/A", inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                // Note: If BotGhost explicitly blocks direct browser requests via CORS, 
                // you will need to activate a browser extension like "Allow CORS" to pass through.
                const res = await fetch(BOTGHOST_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) alert('Success.');
                else alert('Webhook failed. Target endpoint rejected the browser transaction.');
            } catch(e) {
                alert('CORS Blocked or Server Error.');
                console.error(e);
            }
        }

        window.onload = checkCallback;
    </script>
</body>
</html>
