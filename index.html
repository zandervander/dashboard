<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Transcript Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111214; 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #111214;
        }
        .error-box {
            background-color: #1e1f22;
            border: 1px solid #404249;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        .error-message {
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .error-subtext {
            color: #b5bac1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        #transcriptInput, #passwordInput {
            flex: 1;
            padding: 10px 12px;
            background-color: #2c2f33;
            border: 1px solid #404249;
            border-radius: 4px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
        }
        #transcriptInput:focus, #passwordInput:focus {
            outline: none;
            border-color: #5865f2;
        }
        #submitBtn, #passwordBtn {
            padding: 10px 20px;
            background-color: #5865f2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            font-weight: 500;
        }
        #submitBtn:hover, #passwordBtn:hover {
            background-color: #4752c4;
        }
        #submitBtn:active, #passwordBtn:active {
            background-color: #3c45a5;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #5865f2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            font-weight: 500;
            display: none;
            z-index: 1000;
        }
        .back-button:hover {
            background-color: #4752c4;
        }
        .back-button:active {
            background-color: #3c45a5;
        }
        .back-button.show {
            display: block;
        }
        .password-error {
            color: #ed4245;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
        .password-error.show {
            display: block;
        }
    </style>
</head>
<body>

    <button id="backBtn" class="back-button">← Back</button>
    <iframe id="transcript-frame" src="" sandbox="allow-scripts allow-same-origin"></iframe>

    <script>
        // Change this password to your desired password
        const PASSWORD = 'SLRP56hh3b88TRANSCRIPTS884H324GVhg873HaSJ88FOR88j-9.1.26';

        const urlParams = new URLSearchParams(window.location.search);
        let transcriptUrl = urlParams.get('transcript');
        const isAuthenticated = sessionStorage.getItem('transcriptViewerAuth') === 'true';

        const iframe = document.getElementById('transcript-frame');
        const backBtn = document.getElementById('backBtn');

        function showPasswordPrompt() {
            const errorContainer = document.createElement('div');
            errorContainer.className = 'error-container';
            errorContainer.innerHTML = `
                <div class="error-box">
                    <h2 class="error-message">Authentication Required</h2>
                    <p class="error-subtext">Enter the password to access transcripts</p>
                    <div class="input-group">
                        <input type="password" id="passwordInput" placeholder="Enter password..." />
                        <button id="passwordBtn">Access</button>
                    </div>
                    <div class="password-error" id="passwordError">Invalid password</div>
                </div>
            `;
            document.body.appendChild(errorContainer);

            const input = document.getElementById('passwordInput');
            const submitBtn = document.getElementById('passwordBtn');
            const errorDiv = document.getElementById('passwordError');

            const handleSubmit = () => {
                if (input.value === PASSWORD) {
                    sessionStorage.setItem('transcriptViewerAuth', 'true');
                    window.location.reload();
                } else {
                    errorDiv.classList.add('show');
                    input.value = '';
                    input.focus();
                }
            };

            submitBtn.addEventListener('click', handleSubmit);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSubmit();
                }
            });

            input.focus();
        }

        function showTranscriptViewer() {
            if (transcriptUrl) {
                transcriptUrl = decodeURIComponent(transcriptUrl);
                iframe.src = 'https://transcripts.botghost.com/view/' + transcriptUrl;
                backBtn.classList.add('show');
                
                backBtn.addEventListener('click', () => {
                    window.location.href = window.location.pathname;
                });
            } else {
                const errorContainer = document.createElement('div');
                errorContainer.className = 'error-container';
                errorContainer.innerHTML = `
                    <div class="error-box">
                        <h2 class="error-message">No Transcript Found</h2>
                        <p class="error-subtext">Enter a transcript ID to view it</p>
                        <div class="input-group">
                            <input type="text" id="transcriptInput" placeholder="Paste transcript ID here..." />
                            <button id="submitBtn">View</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(errorContainer);

                const input = document.getElementById('transcriptInput');
                const submitBtn = document.getElementById('submitBtn');

                const handleSubmit = () => {
                    const id = input.value.trim();
                    if (id) {
                        window.location.href = '?transcript=' + encodeURIComponent(id);
                    }
                };

                submitBtn.addEventListener('click', handleSubmit);
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleSubmit();
                    }
                });

                input.focus();
            }
        }

        // Check authentication on page load
        if (isAuthenticated) {
            showTranscriptViewer();
        } else {
            showPasswordPrompt();
        }
    </script>
</body>
</html>
