<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Transcript Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111214; 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #111214;
        }
        .error-box {
            background-color: #1e1f22;
            border: 1px solid #404249;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        .error-message {
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .error-subtext {
            color: #b5bac1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        #transcriptInput {
            flex: 1;
            padding: 10px 12px;
            background-color: #2c2f33;
            border: 1px solid #404249;
            border-radius: 4px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
        }
        #transcriptInput:focus {
            outline: none;
            border-color: #5865f2;
        }
        #submitBtn {
            padding: 10px 20px;
            background-color: #5865f2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            font-weight: 500;
        }
        #submitBtn:hover {
            background-color: #4752c4;
        }
        #submitBtn:active {
            background-color: #3c45a5;
        }
    </style>
</head>
<body>

    <iframe id="transcript-frame" src="" sandbox="allow-scripts allow-same-origin"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let transcriptUrl = urlParams.get('transcript');

        const iframe = document.getElementById('transcript-frame');

        if (transcriptUrl) {
            transcriptUrl = decodeURIComponent(transcriptUrl);
            iframe.src = 'https://transcripts.botghost.com/view/' + transcriptUrl;
        } else {
            const errorContainer = document.createElement('div');
            errorContainer.className = 'error-container';
            errorContainer.innerHTML = `
                <div class="error-box">
                    <h2 class="error-message">No Transcript Found</h2>
                    <p class="error-subtext">Enter a transcript ID to view it</p>
                    <div class="input-group">
                        <input type="text" id="transcriptInput" placeholder="Paste transcript ID here..." />
                        <button id="submitBtn">View</button>
                    </div>
                </div>
            `;
            document.body.appendChild(errorContainer);

            const input = document.getElementById('transcriptInput');
            const submitBtn = document.getElementById('submitBtn');

            const handleSubmit = () => {
                const id = input.value.trim();
                if (id) {
                    window.location.href = '?transcript=' + encodeURIComponent(id);
                }
            };

            submitBtn.addEventListener('click', handleSubmit);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSubmit();
                }
            });

            input.focus();
        }
    </script>
</body>
</html>
